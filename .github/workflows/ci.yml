name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install PDM and locked dependencies
        run: |
          python -m pip install --disable-pip-version-check pdm
          pdm install --frozen-lockfile -G dev
      - name: Lint and test
        run: |
          pdm run ruff check src tests scripts
          pdm run ruff format --check src tests scripts
          pdm run pytest
          pdm run python scripts/validate.py
          pdm run python scripts/check_release.py v0.1.2

  container:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build production container
        run: docker build --build-arg APP_VERSION=0.1.2 -t piphi-webrtc-sidecar:ci .
      - name: Verify embedded go2rtc
        run: docker run --rm piphi-webrtc-sidecar:ci /usr/local/bin/go2rtc -version
