api:
  listen: "127.0.0.1:1984"
  origin: ""

rtsp:
  listen: "127.0.0.1:8554"

webrtc:
  listen: ":8555"

exec:
  allow_paths:
    - "/usr/bin/ffmpeg"

ffmpeg:
  bin: "/usr/bin/ffmpeg"
  h264: "-codec:v libx264 -g:v 30 -preset:v veryfast -tune:v zerolatency -profile:v baseline -level:v 4.1 -pix_fmt:v yuv420p"

streams:
